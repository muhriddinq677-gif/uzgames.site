<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate 5vs5 Football</title>
    <style>
        body { margin: 0; background: #1b5e20; overflow: hidden; font-family: 'Arial Black', sans-serif; touch-action: none; }
        #ui { position: absolute; top: 10px; width: 100%; text-align: center; color: white; font-size: 22px; z-index: 10; pointer-events: none; }
        canvas { display: block; background: #2e7d32; margin: auto; border: 4px solid white; }
        .controls-container { position: fixed; bottom: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 15px; box-sizing: border-box; pointer-events: auto; z-index: 50; }
        .team-panel { display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .stick-base { width: 80px; height: 80px; background: rgba(255,255,255,0.1); border: 2px solid #fff; border-radius: 50%; position: relative; touch-action: none; }
        .stick-pad { width: 35px; height: 35px; background: #fff; border-radius: 50%; position: absolute; top: 22.5px; left: 22.5px; opacity: 0.8; pointer-events: none; }
        .btn { width: 55px; height: 55px; border-radius: 50%; border: 2px solid white; color: white; font-weight: bold; font-size: 10px; cursor: pointer; background: #444; display: flex; align-items: center; justify-content: center; }
        .shot { background: #e74c3c; } .swit { background: #3498db; } .tac-btn { background: #f39c12; width: 60px; height: 35px; border-radius: 5px; }
        #msg { position: absolute; top: 35%; width: 100%; text-align: center; color: #f1c40f; font-size: 60px; display: none; text-shadow: 4px 4px #000; z-index: 100; }
    </style>
</head>
<body>

<div id="ui">🧍‍♀️ <span id="s1">0</span> - <span id="s2">0</span> 🧍‍♂️ | ⏱ <span id="tm">90</span>s</div>
<div id="msg">GOAL!!!</div>
<canvas id="game"></canvas>

<div class="controls-container">
    <div class="team-panel">
        <div class="btn-group" style="display:flex; gap:5px;">
            <button class="btn tac-btn" onpointerdown="changeTac('blue')">TAC (Z)</button>
            <button class="btn swit" onpointerdown="switchP('blue')">SW (C)</button>
            <button class="btn shot" onpointerdown="shoot('blue')">SH (X)</button>
        </div>
        <div id="joy1_base" class="stick-base"><div id="pad1" class="stick-pad"></div></div>
    </div>
    <div class="team-panel">
        <div class="btn-group" style="display:flex; gap:5px;">
            <button class="btn shot" onpointerdown="shoot('red')">SH (N)</button>
            <button class="btn swit" onpointerdown="switchP('red')">SW (B)</button>
            <button class="btn tac-btn" onpointerdown="changeTac('red')">TAC (M)</button>
        </div>
        <div id="joy2_base" class="stick-base"><div id="pad2" class="stick-pad"></div></div>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const VW = 1200, VH = 700;
let scores = [0, 0], timer = 90, gameActive = true, keys = {};
const PLAYER_SPEED = 8;

const formations = [
    { n: "2-1-1-1", p: [80, 350, 250, 150, 250, 550, 400, 350, 550, 350] },
    { n: "1-2-1-1", p: [80, 350, 200, 350, 400, 150, 400, 550, 550, 350] },
    { n: "2-2-1",   p: [80, 350, 250, 200, 250, 500, 450, 200, 450, 500] },
    { n: "3-1-1",   p: [80, 350, 250, 100, 250, 350, 250, 600, 500, 350] },
    { n: "1-1-2-1", p: [80, 350, 200, 350, 350, 350, 500, 150, 500, 550] }
];

let bTac = 0, rTac = 0;
const createTeam = (side, color, tIdx) => {
    let p = []; let d = formations[tIdx].p;
    for(let i=0; i<10; i+=2) {
        p.push({
            x: side==='blue' ? d[i] : VW-d[i], y: d[i+1],
            r: 18, color, team: side, isControlled: (i===8), vx: 0, vy: 0
        });
    }
    return p;
};

let blueT = createTeam('blue', '#2980b9', 0);
let redT = createTeam('red', '#c0392b', 0);
let ball = { x: 600, y: 350, r: 10, dx: 0, dy: 0, owner: null };

window.addEventListener('keydown', e => { 
    const k = e.key.toLowerCase(); keys[k] = true;
    if(k==='z') changeTac('blue'); if(k==='x') shoot('blue'); if(k==='c') switchP('blue');
    if(k==='m') changeTac('red'); if(k==='n') shoot('red'); if(k==='b') switchP('red');
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function setupJoystick(baseId, padId, side) {
    const base = document.getElementById(baseId), pad = document.getElementById(padId);
    let active = false, startPos = { x: 0, y: 0 };
    base.addEventListener('pointerdown', e => { active = true; startPos = { x: e.clientX, y: e.clientY }; e.preventDefault(); });
    window.addEventListener('pointermove', e => {
        if (!active || !gameActive) return;
        let dx = e.clientX - startPos.x, dy = e.clientY - startPos.y;
        const dist = Math.hypot(dx, dy), max = 30;
        if (dist > max) { dx *= max / dist; dy *= max / dist; }
        pad.style.transform = `translate(${dx}px, ${dy}px)`;
        const p = (side === 'blue' ? blueT : redT).find(pl => pl.isControlled);
        if (p) { p.vx = (dx / max) * PLAYER_SPEED; p.vy = (dy / max) * PLAYER_SPEED; }
    });
    window.addEventListener('pointerup', () => { active = false; pad.style.transform = 'translate(0,0)'; [...blueT, ...redT].forEach(p => { if(p.team === side) { p.vx = 0; p.vy = 0; } }); });
}
setupJoystick('joy1_base', 'pad1', 'blue'); setupJoystick('joy2_base', 'pad2', 'red');

function switchP(side) {
    let t = side==='blue' ? blueT : redT;
    let minDist = 9999, nearIdx = 0;
    t.forEach((p, i) => { let d = Math.hypot(p.x-ball.x, p.y-ball.y); if(d < minDist) { minDist = d; nearIdx = i; } });
    t.forEach(p => { p.isControlled = false; p.vx = 0; p.vy = 0; });
    t[nearIdx].isControlled = true;
}

function changeTac(s) {
    if(s==='blue'){ bTac=(bTac+1)%5; blueT=createTeam('blue','#2980b9',bTac); }
    else { rTac=(rTac+1)%5; redT=createTeam('red','#c0392b',rTac); }
}

function shoot(side) { if(ball.owner===side){ ball.dx=(side==='blue'?26:-26); ball.dy=(Math.random()-0.5)*10; ball.owner=null; } }

function showMsg(txt, dur = 1000) {
    let m = document.getElementById('msg'); m.innerText = txt; m.style.display = "block";
    gameActive = false; setTimeout(() => { m.style.display = "none"; if(timer > 0) gameActive = true; }, dur);
}

function update() {
    if(!gameActive) return;
    if(timer <= 0) { showMsg("FINISH!", 5000); gameActive = false; return; }
    
    let pb = blueT.find(p=>p.isControlled), pr = redT.find(p=>p.isControlled);
    if(keys['w']) pb.vy = -PLAYER_SPEED; else if(keys['s']) pb.vy = PLAYER_SPEED; else if(!pb.vx) pb.vy = 0;
    if(keys['a']) pb.vx = -PLAYER_SPEED; else if(keys['d']) pb.vx = PLAYER_SPEED; else if(!pb.vy) pb.vx = 0;
    if(keys['arrowup']) pr.vy = -PLAYER_SPEED; else if(keys['arrowdown']) pr.vy = PLAYER_SPEED; else if(!pr.vx) pr.vy = 0;
    if(keys['arrowleft']) pr.vx = -PLAYER_SPEED; else if(keys['arrowright']) pr.vx = PLAYER_SPEED; else if(!pr.vy) pr.vx = 0;

    ball.x += ball.dx; ball.y += ball.dy; ball.dx *= 0.98; ball.dy *= 0.98;
    if(ball.y < 15 || ball.y > VH-15) { showMsg("OUT!"); ball.dx = 0; ball.dy = 0; ball.y = ball.y < 15 ? 40 : VH-40; }

    if(ball.x < 15 || ball.x > VW-15) {
        if(ball.y > 250 && ball.y < 450) {
            let win = ball.x < 15 ? 1 : 0; scores[win]++; 
            document.getElementById('s1').innerText = scores[0]; document.getElementById('s2').innerText = scores[1];
            showMsg("GOAL!!!"); ball = {x:600, y:350, r:10, dx:0, dy:0, owner:null};
            blueT = createTeam('blue', '#2980b9', bTac); redT = createTeam('red', '#c0392b', rTac);
        } else { showMsg(ball.dx < 0 ? "CORNER!" : "GOAL KICK!"); ball.x = ball.x < 15 ? 100 : VW-100; ball.dx = 0; ball.dy = 0; }
    }

    [...blueT, ...redT].forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if(Math.hypot(p.x-ball.x, p.y-ball.y) < p.r+ball.r) {
            ball.owner = p.team; ball.dx = 0; ball.dy = 0;
            ball.x = p.x + (p.team==='blue'?22:-22); ball.y = p.y;
            let team = p.team==='blue' ? blueT : redT;
            team.forEach(pl => pl.isControlled = false); p.isControlled = true;
        }
        p.x = Math.max(20, Math.min(VW - 20, p.x)); p.y = Math.max(20, Math.min(VH - 20, p.y));
    });
}

function draw() {
    ctx.clearRect(0,0,VW,VH); ctx.strokeStyle="white"; ctx.lineWidth=4;
    ctx.strokeRect(15,15,VW-30,VH-30); ctx.beginPath(); ctx.moveTo(VW/2,15); ctx.lineTo(VW/2,VH-15); ctx.stroke();
    ctx.beginPath(); ctx.arc(VW/2,VH/2,80,0,Math.PI*2); ctx.stroke();
    ctx.strokeRect(15,180,150,340); ctx.strokeRect(VW-165,180,150,340);
    ctx.fillStyle="rgba(255,255,255,0.1)"; ctx.fillRect(0,250,30,200); ctx.fillRect(VW-30,250,30,200);
    ctx.fillStyle="yellow"; [15,VW-15].forEach(x=>[15,VH-15].forEach(y=>{ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();}));
    [...blueT, ...redT].forEach(p => {
        ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
        if(p.isControlled){ctx.strokeStyle="yellow"; ctx.lineWidth=4; ctx.stroke();}
    });
    ctx.fillStyle="white"; ctx.beginPath(); ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2); ctx.fill(); ctx.stroke();
}

function loop() {
    let s = Math.min(window.innerWidth/VW, (window.innerHeight*0.75)/VH);
    canvas.width=VW*s; canvas.height=VH*s; ctx.scale(s,s);
    update(); draw(); requestAnimationFrame(loop);
}

setInterval(() => { if(timer > 0 && gameActive) { timer--; document.getElementById('tm').innerText = timer; } }, 1000);
loop();
</script>
</body>
</html>
