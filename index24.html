<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flappy Bird - Real Qush</title>
    <style>
        body { margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #1a1a1a; font-family: 'Segoe UI', sans-serif; overflow: hidden; touch-action: manipulation; }
        canvas { background: #70c5ce; box-shadow: 0 0 30px rgba(0,0,0,0.5); max-width: 100%; max-height: 100vh; border-radius: 5px; }
        #ui { position: absolute; top: 20px; color: white; text-align: center; pointer-events: none; width: 100%; z-index: 10; }
        .stats { font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.6); }
    </style>
</head>
<body>
    <div id="ui">
        <div class="stats">Ball: <span id="score">0</span> | Rekord: <span id="best">0</span></div>
        <div id="levelDisplay" style="font-size: 16px; color: #ffd700; margin-top: 5px;">Daraja: 1</div>
    </div>
    <canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const scoreEl = document.getElementById("score");
const bestEl = document.getElementById("best");
const levelEl = document.getElementById("levelDisplay");

function resize() {
    canvas.width = window.innerWidth > 400 ? 400 : window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

let bird = { x: 50, y: canvas.height/2, w: 38, h: 30, g: 0.45, jump: -7, v: 0, angle: 0 };
let pipes = [];
let score = 0;
let best = localStorage.getItem("flappyBest") || 0;
let level = 1;
let gameSpeed = 2.2;
let frame = 0;
let gameState = "START"; 

bestEl.innerText = best;

// Qushni chizish funksiyasi
function drawBird() {
    ctx.save();
    ctx.translate(bird.x + bird.w/2, bird.y + bird.h/2);
    
    // Qushni harakat yo'nalishiga qarab egish
    bird.angle = Math.min(Math.PI/4, Math.max(-Math.PI/4, bird.v * 0.05));
    ctx.rotate(bird.angle);

    // Qush tanasi (sariq)
    ctx.fillStyle = "#f1c40f";
    ctx.beginPath();
    ctx.ellipse(0, 0, bird.w/2, bird.h/2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "black";
    ctx.lineWidth = 2;
    ctx.stroke();

    // Qanot (oq)
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.ellipse(-8, 2, 10, 6, Math.PI/4, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Ko'z
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(8, -5, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.arc(10, -5, 2, 0, Math.PI * 2);
    ctx.fill();

    // Tumshug'i (to'q sariq)
    ctx.fillStyle = "#e67e22";
    ctx.beginPath();
    ctx.moveTo(15, 0);
    ctx.lineTo(25, 5);
    ctx.lineTo(15, 10);
    ctx.fill();
    ctx.stroke();

    ctx.restore();
}

function update() {
    if (gameState !== "PLAY") return;

    bird.v += bird.g;
    bird.y += bird.v;

    if (frame % Math.max(65, 100 - (level * 3)) === 0) {
        let gap = 150 - (level * 4);
        let top = Math.random() * (canvas.height - gap - 150) + 75;
        pipes.push({ x: canvas.width, w: 60, t: top, b: canvas.height - top - gap, passed: false });
    }

    pipes.forEach((p, i) => {
        p.x -= gameSpeed;

        if (!p.passed && p.x + p.w < bird.x) {
            score++;
            p.passed = true;
            scoreEl.innerText = score;
            if (score % 5 === 0) {
                level++;
                gameSpeed += 0.4;
                levelEl.innerText = "Daraja: " + level;
            }
        }

        if (bird.x + 5 < p.x + p.w && bird.x + bird.w - 5 > p.x &&
            (bird.y + 5 < p.t || bird.y + bird.h - 5 > canvas.height - p.b)) {
            gameOver();
        }

        if (p.x + p.w < 0) pipes.splice(i, 1);
    });

    if (bird.y + bird.h > canvas.height || bird.y < 0) gameOver();
    frame++;
}

function gameOver() {
    gameState = "END";
    if (score > best) {
        best = score;
        localStorage.setItem("flappyBest", best);
        bestEl.innerText = best;
    }
}

function reset() {
    bird.y = canvas.height / 2;
    bird.v = 0;
    pipes = [];
    score = 0;
    level = 1;
    gameSpeed = 2.2;
    frame = 0;
    gameState = "PLAY";
    scoreEl.innerText = score;
    levelEl.innerText = "Daraja: " + level;
}

function draw() {
    // Fon chizish (osmon effekti)
    ctx.fillStyle = "#70c5ce";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // To'siqlar (quvurlar)
    pipes.forEach(p => {
        ctx.fillStyle = "#2ecc71";
        ctx.fillRect(p.x, 0, p.w, p.t); // Yuqori quvur
        ctx.fillRect(p.x, canvas.height - p.b, p.w, p.b); // Pastki quvur
        // Quvurlar labi
        ctx.fillStyle = "#27ae60";
        ctx.fillRect(p.x - 5, p.t - 20, p.w + 10, 20);
        ctx.fillRect(p.x - 5, canvas.height - p.b, p.w + 10, 20);
    });

    drawBird();

    if (gameState === "START") {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 20px Arial";
        ctx.fillText("BOSHLASH UCHUN BOSING", canvas.width/2, canvas.height/2);
    } else if (gameState === "END") {
        ctx.fillStyle = "rgba(0,0,0,0.7)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 28px Arial";
        ctx.fillText("O'YIN TUGADI", canvas.width/2, canvas.height/2 - 20);
        ctx.font = "18px Arial";
        ctx.fillText("Qayta boshlash uchun bosing", canvas.width/2, canvas.height/2 + 30);
    }

    update();
    requestAnimationFrame(draw);
}

const action = (e) => {
    if (e) e.preventDefault();
    if (gameState === "PLAY") bird.v = bird.jump;
    else reset();
};

window.addEventListener("keydown", e => { if(e.code === "Space" || e.code === "ArrowUp") action(); });
canvas.addEventListener("touchstart", action, {passive: false});
canvas.addEventListener("mousedown", action);

draw();
</script>
</body>
</html>
