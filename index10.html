<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mashina o'yini2 </title>

<style>
body{
margin:0;
font-family:sans-serif;
overflow:hidden;
background:#87CEEB;
transition:.3s
}

.topUI{
position:fixed;
top:0;
left:50%;
transform:translateX(-50%);
width:95%;
max-width:900px;
display:flex;
justify-content:space-between;
align-items:center;
padding:8px;
background:rgba(0,0,0,.8);
color:white;
z-index:100;
font-size:14px;
border-radius:10px;
flex-wrap:wrap;
text-align:center;
}

button{
margin:2px;
padding:5px 10px;
cursor:pointer
}

.game{
display:flex;
justify-content:center;
gap:20px;
height:90vh;
margin-top:70px;
}

.road{
width:35%;
max-width:260px;
height:80vh;
position:relative;
overflow:hidden;
background:#555;
border-left:3px solid white;
border-right:3px solid white;
border-radius:10px;
}

.lane{
position:absolute;
width:4px;
height:100%;
background:repeating-linear-gradient(
to bottom,
white 0px,
white 20px,
transparent 20px,
transparent 40px
);
left:50%;
transform:translateX(-50%);
}

.car{
width:50px;
height:90px;
position:absolute;
bottom:120px;
left:50%;
transform:translateX(-50%);
border-radius:12px;
box-shadow:0 5px 15px rgba(0,0,0,.5);
}

.car .glass{
position:absolute;
width:60%;
height:25%;
background:white;
top:10px;
left:20%;
border-radius:5px;
}

.wheel{
position:absolute;
width:14px;
height:14px;
background:black;
border-radius:50%;
bottom:-8px;
}
.w1{left:5px}
.w2{right:5px}
.w3{left:5px;top:50px}
.w4{right:5px;top:50px}

.obstacle{
width:45px;
height:35px;
background:black;
position:absolute;
top:-50px;
border-radius:6px;
}

.controls{
position:absolute;
bottom:40px;
width:100%;
display:flex;
justify-content:space-between;
z-index:50;
}

.ctrl{
background:rgba(0,0,0,.8);
color:white;
padding:15px;
font-size:22px;
flex:1;
text-align:center;
user-select:none;
}

.night{background:black}
.night .road{background:#222}

.startScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
display:flex;
justify-content:center;
align-items:center;
z-index:200;
}

.startBtn{
font-size:25px;
padding:15px 40px;
background:lime;
border:none;
border-radius:10px;
cursor:pointer;
}

</style>
</head>
<body>

<div class="startScreen" id="startScreen">
<button class="startBtn" onclick="startGame()">BOSHLASH</button>
</div>

<div class="topUI">
<div>
P1 ❤️<span id="p1Lives"></span>
⭐<span id="p1Score"></span>
🪙<span id="p1Coin"></span>
</div>

<div>
<button onclick="setDay()">☀</button>
<button onclick="setNight()">🌙</button>
</div>

<div>
P2 ❤️<span id="p2Lives"></span>
⭐<span id="p2Score"></span>
🪙<span id="p2Coin"></span>
</div>
</div>

<div class="game">

<div class="road" id="road1">
<div class="lane"></div>
<div class="car" id="car1">
<div class="glass"></div>
<div class="wheel w1"></div>
<div class="wheel w2"></div>
<div class="wheel w3"></div>
<div class="wheel w4"></div>
</div>
<div class="controls">
<div class="ctrl" onclick="moveLeft(1)">◀</div>
<div class="ctrl" onclick="moveRight(1)">▶</div>
</div>
</div>

<div class="road" id="road2">
<div class="lane"></div>
<div class="car" id="car2">
<div class="glass"></div>
<div class="wheel w1"></div>
<div class="wheel w2"></div>
<div class="wheel w3"></div>
<div class="wheel w4"></div>
</div>
<div class="controls">
<div class="ctrl" onclick="moveLeft(2)">◀</div>
<div class="ctrl" onclick="moveRight(2)">▶</div>
</div>
</div>

</div>

<script>

let p1={lives:5,score:0,coin:0,pos:50}
let p2={lives:5,score:0,coin:0,pos:50}
let gameRunning=false
let speed=4

function updateUI(){
p1Lives.innerText=p1.lives
p1Score.innerText=p1.score
p1Coin.innerText=p1.coin
p2Lives.innerText=p2.lives
p2Score.innerText=p2.score
p2Coin.innerText=p2.coin
}

function moveLeft(pl){
if(!gameRunning)return
let p=pl==1?p1:p2
p.pos-=20
if(p.pos<20)p.pos=20
document.getElementById("car"+pl).style.left=p.pos+"%"
}

function moveRight(pl){
if(!gameRunning)return
let p=pl==1?p1:p2
p.pos+=20
if(p.pos>80)p.pos=80
document.getElementById("car"+pl).style.left=p.pos+"%"
}

function createObstacle(roadId,player){
if(!gameRunning)return
let obs=document.createElement("div")
obs.className="obstacle"
obs.style.left=Math.random()*70+"%"
document.getElementById(roadId).appendChild(obs)

let fall=setInterval(()=>{
if(!gameRunning){clearInterval(fall);obs.remove();return}
let top=obs.offsetTop
obs.style.top=top+speed+"px"

let car=document.getElementById("car"+player)
if(top>car.offsetTop-40 &&
Math.abs(obs.offsetLeft-car.offsetLeft)<40){
obs.remove()
clearInterval(fall)
if(player==1)p1.lives--
else p2.lives--
updateUI()
}

if(top>600){
obs.remove()
clearInterval(fall)
if(player==1){p1.score++;p1.coin++}
else{p2.score++;p2.coin++}
updateUI()
}

if(p1.lives<=0||p2.lives<=0){
gameRunning=false
alert("O'yin tugadi!")
location.reload()
}

},20)
}

function startGame(){
document.getElementById("startScreen").style.display="none"
gameRunning=true
updateUI()
setInterval(()=>createObstacle("road1",1),1500)
setInterval(()=>createObstacle("road2",2),1700)
}

function setNight(){document.body.classList.add("night")}
function setDay(){document.body.classList.remove("night")}

updateUI()

</script>

</body>
</html>
