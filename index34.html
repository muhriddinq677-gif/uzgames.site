<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrows Path - 100 Levels</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151d30;
            --accent: #3b82f6;
            --panel-bg: #091124;
            --brown-block: #543d34; /* Rasmdagi to'q jigarrang bloklar */
            --dot-color: #b1b9c4;  /* Rasmdagi kulrang fon nuqtachalari */
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-main);
            color: #f8fafc; font-family: system-ui, -apple-system, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden; user-select: none; touch-action: manipulation;
        }

        .screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; max-width: 450px; padding: 15px; box-sizing: border-box;
        }

        .hud {
            text-align: center; width: 100%; margin-bottom: 15px;
            font-size: 1.2rem; font-weight: bold; background: var(--panel-bg); padding: 14px 20px;
            border-radius: 12px; box-sizing: border-box; border: 1px solid #1e293b; color: #38bdf8;
            letter-spacing: 0.5px;
        }

        /* 📱 RASMDAGI KREM RANG RESPONSIV KONTEYNER */
        .board-wrapper {
            width: 100%; max-width: 400px; aspect-ratio: 1 / 1;
            background: #fdfbf7; border-radius: 24px; padding: 12px;
            box-sizing: border-box; border: 2px solid #e2ded5;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .board {
            display: grid; width: 100%; height: 100%;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Katakchalar foni */
        .dot-container {
            position: relative; display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%; box-sizing: border-box;
        }

        /* Fon nuqtachalari */
        .grid-dot {
            width: 4px; height: 4px; background-color: var(--dot-color); border-radius: 50%;
            z-index: 1; transition: opacity 0.2s;
        }

        /* 🔥 RASMDAGIDEK JOYNLI TO'LIQ TO'LDIRUVCHI JIGARRANG BLOKLAR */
        .path-line {
            position: absolute; width: 101%; height: 101%; /* Kataklar orasida ochiq joy qolmaydi */
            background-color: var(--brown-block); z-index: 5;
            animation: blockPop 0.15s ease-out forwards;
        }

        /* 🎯 STRELKALAR - JIGARRANG BLOKNING BOSHLANISHIGA SAFLANGAN */
        .arrow-item {
            position: absolute; font-size: 20px; color: #5d4037; /* To'q jigarrang strelka */
            font-weight: bold; cursor: pointer; z-index: 12;
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
        }
        /* Strelka yo'nalishlari burchagi */
        .arrow-item.up { transform: rotate(-90deg); }
        .arrow-item.down { transform: rotate(90deg); }
        .arrow-item.left { transform: rotate(180deg); }
        .arrow-item.right { transform: rotate(0deg); }

        .shake-error { animation: arrowShake 0.3s ease; color: #ef4444 !important; }

        /* Tugmalar dizayni */
        .game-controls { display: flex; gap: 10px; width: 100%; margin-top: 20px; }
        .btn {
            border: none; color: white; padding: 12px 15px; font-size: 1rem;
            font-weight: bold; border-radius: 12px; cursor: pointer; transition: background 0.2s, transform 0.1s;
        }
        .btn:active { transform: scale(0.96); }
        .btn-control { background: #3b82f6; flex: 1; }
        .btn-reset { background: #475569; width: auto; padding: 12px 20px; } 

        /* Modal yutuq oynasi */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 6, 23, 0.85); backdrop-filter: blur(4px); z-index: 100;
            justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--bg-card); padding: 30px; border-radius: 16px;
            max-width: 360px; width: 85%; border: 1px solid #1e293b; text-align: center;
        }

        @keyframes blockPop {
            from { transform: scale(0.6); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes arrowShake {
            0%, 100% { transform: translate(0, 0); }
            25% { transform: translate(-4px, -4px); }
            75% { transform: translate(4px, 4px); }
        }
    </style>
</head>

function rotateBoard(deg) {
    boardRotation += deg;
    board.style.transform = `rotateZ(${boardRotation}deg)`;
}

// Modal yutuq oynasini ko'rsatish
function showModal(title, desc, btnText) {
    document.getElementById('modal-title').innerText = title;
    document.getElementById('modal-desc').innerText = desc;
    const btn = document.getElementById('modal-btn');
    btn.innerText = btnText;
    resultModal.style.display = 'flex';
}

    resultModal.style.display = 'none';
    if (currentLevel < 100) {
        currentLevel++;

// Tasodifiy generator olib tashlandi, faqat siz yozgan bosqichlarni aniq yuklaydi
function generateLevelData(lvl) {
    if (levelPaths[lvl]) {
        return levelPaths[lvl];
    }
    // Agar o'yinchi hali o'zingiz yozmagan levelga yetsa, xato bermasligi uchun 1-levelni qaytaradi
    return levelPaths[1]; 
}

// Maydonni yangilash va chizish
function initGame() {
    isAnimating = false;
    hudLeft.innerText = `🧩 Daraja: ${currentLevel} / 100`;

    let levelData = generateLevelData(currentLevel);

    board.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
    board.style.gridTemplateRows = `repeat(${gridRows}, 1fr)`;
    board.innerHTML = '';

    gridMatrix = Array(gridRows).fill().map(() => Array(gridCols).fill(0));
    activeArrowsCount = levelData.length;

    // Nuqtalarni o'rnatish
    for (let r = 0; r < gridRows; r++) {
        gridMatrix[r] = [];
        for (let c = 0; c < gridCols; c++) {
            gridMatrix[r][c] = 0;

            const dotContainer = document.createElement('div');
            dotContainer.className = 'dot-container';
            dotContainer.id = `cell-${r}-${c}`;
            
            const dot = document.createElement('div');
            dot.className = 'grid-dot';
            dotContainer.appendChild(dot);
            board.appendChild(dotContainer);
        }
    }

    // Strelkalarni saf bo'yicha chizish
    levelData.forEach(arrow => {
        const startCell = document.getElementById(`cell-${arrow.startR}-${arrow.startC}`);
        if (startCell) {
            const dot = startCell.querySelector('.grid-dot');
            if (dot) dot.style.opacity = '0'; 

            const arrowEl = document.createElement('div');
            arrowEl.className = `arrow-item ${arrow.dir.toLowerCase()}`;
            arrowEl.innerHTML = '➔';
            
            arrowEl.onclick = (e) => {
                e.stopPropagation();
                drawArrowPath(arrow);
            };
            startCell.appendChild(arrowEl);
            gridMatrix[arrow.startR][arrow.startC] = 2; 
        }
    });
}

// Kataklarni to'liq qoplovchi chizish mexanikasi
function drawArrowPath(arrow) {
    if (isAnimating) return;
    
    let currentR = arrow.startR;
    let currentC = arrow.startC;
    let pathCells = [];
    let canComplete = true;

    for (let i = 0; i < arrow.steps.length; i++) {
        const stepDir = arrow.steps[i];
        if (stepDir === 'R') currentC++;
        else if (stepDir === 'L') currentC--;
        else if (stepDir === 'U') currentR--;
        else if (stepDir === 'D') currentR++;

        if (currentR < 0 || currentR >= gridRows || currentC < 0 || currentC >= gridCols) {
            break; 
        }

        if (gridMatrix[currentR][currentC] > 0) {
            canComplete = false;
            break;
        }
        pathCells.push({ r: currentR, c: currentC });
    }

    if (canComplete) {
        isAnimating = true;
        
        const startCell = document.getElementById(`cell-${arrow.startR}-${arrow.startC}`);
        const arrowEl = startCell.querySelector('.arrow-item');
        if (arrowEl) arrowEl.remove();
        
        const startLine = document.createElement('div');
        startLine.className = 'path-line';
        startCell.appendChild(startLine);
        gridMatrix[arrow.startR][arrow.startC] = 1;

        pathCells.forEach((cell, index) => {
            setTimeout(() => {
                const cellEl = document.getElementById(`cell-${cell.r}-${cell.c}`);
                if (cellEl) {
                    const dot = cellEl.querySelector('.grid-dot');
                    if (dot) dot.style.opacity = '0';

                    const blockSegment = document.createElement('div');
                    blockSegment.className = 'path-line';
                    cellEl.appendChild(blockSegment);
                    gridMatrix[cell.r][cell.c] = 1;
                }
                if (index === pathCells.length - 1) {
                    isAnimating = false;
                    activeArrowsCount--;
                    checkGameStatus();
                }
            }, index * 60);
        });
    } else {
        isAnimating = true;
        const startCell = document.getElementById(`cell-${arrow.startR}-${arrow.startC}`);
        const arrowEl = startCell.querySelector('.arrow-item');
        if (arrowEl) {
            arrowEl.classList.add('shake-error');
            setTimeout(() => {
                arrowEl.classList.remove('shake-error');
                isAnimating = false;
            }, 300);
        }
    }
}

// Bosqich tugaganini tekshirish
function checkGameStatus() {
    if (activeArrowsCount <= 0) {
        setTimeout(() => {
            showModal(`Bosqich ${currentLevel} Yakunlandi! 🎉`, "Mantiqiy zanjirni to'g'ri topdingiz. Keyingi darajaga o'tamiz.", "Davom etish");
        }, 300);
    }
}

// Kod to'liq yuklangach o'yinni boshlash
window.onload = function() {
    initGame();
};
