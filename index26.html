<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tak Toe</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --cell-bg: #16213e;
            --x-color: #e94560;
            --o-color: #4ecca3;
            --line-color: #f8b400; /* Chiziq rangi */
        }

        body {
            background-color: var(--bg);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            touch-action: manipulation;
        }

        .menu { margin-bottom: 20px; }
        select {
            padding: 8px;
            border-radius: 5px;
            background: #0f3460;
            color: white;
            border: 1px solid #533483;
        }

        #status { font-size: 1.5rem; margin-bottom: 15px; height: 35px; }

        /* Board uchun nisbiy pozitsiya */
        .board-container { position: relative; }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 90vw;
            max-width: 350px;
            aspect-ratio: 1/1;
        }

        .cell {
            background: var(--cell-bg);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            border: 2px solid transparent;
            z-index: 1;
        }

        .cell:hover { background: #1f4068; }
        .cell.x { color: var(--x-color); }
        .cell.o { color: var(--o-color); }

        /* G'alaba chizig'i stili */
        #strike {
            position: absolute;
            background-color: var(--line-color);
            display: none;
            z-index: 10;
            transition: 0.3s ease-in-out;
            border-radius: 10px;
        }

        .controls { margin-top: 25px; display: flex; gap: 10px; }
        button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #533483;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
<button 
    onclick="window.location.href='index.html'"
    style="
        position: fixed;
        top: 20px;
        right: 20px;
        padding: clamp(8px, 2vw, 12px) clamp(15px, 4vw, 25px);
        font-size: clamp(14px, 2.5vw, 18px);
        background-color: #ff4757;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-family: sans-serif;
        font-weight: 600;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        transition: all 0.3s ease;
        z-index: 9999;
    "
    onmouseover="this.style.backgroundColor='#ff6b81'; this.style.transform='scale(1.05)';"
    onmouseout="this.style.backgroundColor='#ff4757'; this.style.transform='scale(1)';"
>
    Chiqish
</button>

    <h1>X vs O</h1>

    <div class="menu">
        Rejim: 
        <select id="gameMode" onchange="restartGame()">
            <option value="pvp">2 Kishilik </option>
            <option value="pve">Bot bilan </option>
        </select>
    </div>

    <div id="status">X boshlaydi</div>

    <div class="board-container">
        <div id="strike"></div> <!-- Chiziq elementi -->
        <div class="board" id="board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>
    </div>

    <div class="controls">
        <button onclick="restartGame()">Yangilash</button>
    </div>

<script>
    const board = document.getElementById('board');
    const cells = document.querySelectorAll('.cell');
    const status = document.getElementById('status');
    const modeSelect = document.getElementById('gameMode');
    const strike = document.getElementById('strike');

    let currentPlayer = "X";
    let gameState = ["", "", "", "", "", "", "", "", ""];
    let gameActive = true;

    // Chiziq pozitsiyalari (top, left, width, height, rotate)
    const winPatterns = [
        { p: [0, 1, 2], s: { t: '15%', l: '5%', w: '90%', h: '6px', r: '0deg' } },
        { p: [3, 4, 5], s: { t: '48%', l: '5%', w: '90%', h: '6px', r: '0deg' } },
        { p: [6, 7, 8], s: { t: '82%', l: '5%', w: '90%', h: '6px', r: '0deg' } },
        { p: [0, 3, 6], s: { t: '5%', l: '15%', w: '6px', h: '90%', r: '0deg' } },
        { p: [1, 4, 7], s: { t: '5%', l: '49%', w: '6px', h: '90%', r: '0deg' } },
        { p: [2, 5, 8], s: { t: '5%', l: '82%', w: '6px', h: '90%', r: '0deg' } },
        { p: [0, 4, 8], s: { t: '0%', l: '49%', w: '6px', h: '100%', r: '-45deg' } },
        { p: [2, 4, 6], s: { t: '0%', l: '49%', w: '6px', h: '100%', r: '45deg' } }
    ];

    function handleCellClick(e) {
        const idx = e.target.getAttribute('data-index');
        if (gameState[idx] !== "" || !gameActive) return;

        makeMove(idx, currentPlayer);

        if (gameActive && modeSelect.value === "pve" && currentPlayer === "O") {
            setTimeout(botMove, 500);
        }
    }

    function makeMove(idx, player) {
        gameState[idx] = player;
        cells[idx].innerText = player;
        cells[idx].classList.add(player.toLowerCase());
        checkResult();
    }

    function botMove() {
        if (!gameActive) return;
        let available = [];
        gameState.forEach((val, i) => { if(val === "") available.push(i); });
        if (available.length > 0) {
            const randomIdx = available[Math.floor(Math.random() * available.length)];
            makeMove(randomIdx, "O");
        }
    }

    function checkResult() {
        let roundWon = false;
        let winInfo = null;

        for (let item of winPatterns) {
            let [a, b, c] = item.p;
            if (gameState[a] && gameState[a] === gameState[b] && gameState[a] === gameState[c]) {
                roundWon = true;
                winInfo = item.s;
                break;
            }
        }

        if (roundWon) {
            status.innerText = `${currentPlayer} yutdi! 🎉`;
            gameActive = false;
            drawWinningLine(winInfo);
            return;
        }

        if (!gameState.includes("")) {
            status.innerText = "Durang! 🤝";
            gameActive = false;
            return;
        }

        currentPlayer = currentPlayer === "X" ? "O" : "X";
        status.innerText = `Navbat: ${currentPlayer}`;
    }

    function drawWinningLine(s) {
        strike.style.display = "block";
        strike.style.top = s.t;
        strike.style.left = s.l;
        strike.style.width = s.w;
        strike.style.height = s.h;
        strike.style.transform = `rotate(${s.r})`;
    }

    function restartGame() {
        currentPlayer = "X";
        gameState = ["", "", "", "", "", "", "", "", ""];
        gameActive = true;
        status.innerText = "X boshlaydi";
        strike.style.display = "none";
        cells.forEach(cell => {
            cell.innerText = "";
            cell.classList.remove('x', 'o');
        });
    }

    cells.forEach(cell => cell.addEventListener('click', handleCellClick));
</script>
</body>
</html>
